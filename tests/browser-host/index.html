<!doctype html><html lang="en"><meta charset="utf-8"><title>AGAIN controlled browser host</title><style>body{font:20px system-ui;margin:5vw;max-width:600px}input,button{font:inherit;padding:12px;margin:12px 0}label{display:block}</style><h1>AGAIN browser test</h1><label for="project">Project name</label><input id="project" placeholder="Name your project"><button id="apply">Apply</button><p role="status" id="result"></p><button id="download">Download result</button><script>document.querySelector('#apply').onclick=()=>document.querySelector('#result').textContent='Applied: '+document.querySelector('#project').value;document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.querySelector('#result').textContent],{type:'text/plain'}));a.download='again-result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
